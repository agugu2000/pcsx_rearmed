name: "pre-release"

# Manual only. Builds the classic set of cores and attaches them to the
# rolling "libretro-devbuild" tag.
#
# Artifact names must match what .github/build-libretro-zip.sh writes:
#   pcsx_rearmed_libretro_<arch>_<platform>_<gpu>.zip
# where <gpu> is the GPU the platform actually builds with (rpi1 and miyoo
# are UNAI, everything else here is NEON).
on:
  workflow_dispatch:

jobs:
  pre-release:
    name: "Pre Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    container:
      image: ubuntu:20.04
    steps:
      - name: Install dependencies
        run: |
          id
          apt-get update -qq
          apt-get install -y make git bc sed zip python3
          apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
          apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build
        run: |
          grep PRETTY_NAME /etc/os-release
          id
          pwd
          git config --global --add safe.directory /__w/pcsx_rearmed/pcsx_rearmed
          .github/build-libretro-zip.sh arm64 CortexA73_G12B
          .github/build-libretro-zip.sh arm32 rpi1 BUILTIN_GPU=unai
          .github/build-libretro-zip.sh arm32 rpi2
          .github/build-libretro-zip.sh arm32 rpi3
          .github/build-libretro-zip.sh arm64 rpi3_64
          .github/build-libretro-zip.sh arm32 rpi4
          .github/build-libretro-zip.sh arm64 rpi4_64
          .github/build-libretro-zip.sh arm32 classic_armv7_a7
          .github/build-libretro-zip.sh arm32 classic_armv8_a35
          .github/build-libretro-zip.sh arm32 miyoo BUILTIN_GPU=unai CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++
      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "libretro-devbuild"
          prerelease: true
          title: "Development Build"
          files: |
            pcsx_rearmed_libretro_arm64_CortexA73_G12B_neon.zip
            pcsx_rearmed_libretro_arm32_rpi1_unai.zip
            pcsx_rearmed_libretro_arm32_rpi2_neon.zip
            pcsx_rearmed_libretro_arm32_rpi3_neon.zip
            pcsx_rearmed_libretro_arm64_rpi3_64_neon.zip
            pcsx_rearmed_libretro_arm32_rpi4_neon.zip
            pcsx_rearmed_libretro_arm64_rpi4_64_neon.zip
            pcsx_rearmed_libretro_arm32_classic_armv7_a7_neon.zip
            pcsx_rearmed_libretro_arm32_classic_armv8_a35_neon.zip
            pcsx_rearmed_libretro_arm32_miyoo_unai.zip
